# Naabiga OS — configuration Calamares
# Installé dans /etc/calamares/settings.conf par le paquet nos-desktop (phase Beta) ; en Alpha copié par le hook ISO.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: nos-cli
  module: shellprocess
  config: shellprocess-nos.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - luksopenswaphookcfg
  - initcpiocfg
  - initramfscfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - packages
  - shellprocess@nos-cli
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: naabiga
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
