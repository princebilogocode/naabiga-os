---
# Finalisation N-OS dans le système installé
dontChroot: false
timeout: 600
script:
  - "rm -f /var/lib/nos/first-boot.done"
  - "systemctl enable nos-first-boot.service || true"
  - "systemctl enable fstrim.timer || true"
  - "systemctl enable zramswap.service || true"
  - "dconf update || true"
  - "update-initramfs -u || true"
  - "rm -f /etc/lightdm/lightdm.conf.d/50-nos-session.conf.live"
