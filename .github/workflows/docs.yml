name: Docs

# Le dépôt est privé : GitHub Pages n'est pas disponible sur ce plan.
# La documentation est construite et publiée comme artefact (site.zip) à chaque changement,
# téléchargeable depuis l'onglet Actions. Elle sera hébergée sur naabiga.com (voir issue #20).
# Pour revenir à GitHub Pages (dépôt public ou plan Pro) : rétablir les étapes upload-pages-artifact + deploy-pages.

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "branding/logo/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - run: cp branding/logo/naabiga-os-logo.png docs/assets/logo.png
      - run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: site
          retention-days: 30
