# Naabiga OS — réglages noyau pour le développement
# Android Studio, Flutter, VS Code, Docker : beaucoup de fichiers surveillés
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
fs.file-max = 2097152
# Avec ZRAM, on privilégie la compression en RAM au swap disque
vm.swappiness = 100
vm.vfs_cache_pressure = 50
vm.page-cluster = 0
# Réseau : réponses plus rapides pour les serveurs de dev locaux
net.core.somaxconn = 4096
net.ipv4.ip_local_port_range = 1024 65535
# Sécurité de base
kernel.kptr_restrict = 1
net.ipv4.conf.all.rp_filter = 1
